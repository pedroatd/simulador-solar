<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Pruebas del modelo solar</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
    .ok { color: #2f7d32; } .fail { color: #c0392b; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Pruebas del modelo</h1>
  <ul id="out"></ul>
  <p id="summary"></p>
  <script type="module">
    import { sunPosition, localToUtc, tzOffsetMinutes } from './js/solar.js';
    import { DEFAULT_CONFIG, cloneConfig, sunVectorLocal, profileAngle, computeInstant } from './js/model.js';

    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    const check = (name, got, want, tol) => {
      const ok = Math.abs(got - want) <= tol;
      ok ? pass++ : fail++;
      out.insertAdjacentHTML('beforeend', `<li class="${ok ? 'ok' : 'fail'}">${ok ? '✔' : '✘'} ${name}: ${got.toFixed(3)} (esperado ${want} ± ${tol})</li>`);
    };

    // Altura máxima del sol en un día (barrido de 1 min)
    const maxAlt = (y, m, d, lat, lon) => {
      let best = { altitude: -99 };
      for (let k = 0; k < 1440; k++) {
        const p = sunPosition(Date.UTC(y, m - 1, d) + k * 60000, lat, lon);
        if (p.altitude > best.altitude) best = p;
      }
      return best;
    };
    const lat = 28.4874, lon = -16.3159;
    const sol = maxAlt(2026, 6, 21, lat, lon);
    check('Altura al mediodía solar, solsticio de verano (La Laguna)', sol.altitude, 90 - (lat - 23.436), 0.1);
    const eq = maxAlt(2026, 3, 20, lat, lon);
    check('Altura al mediodía solar, equinoccio de marzo', eq.altitude, 90 - lat, 0.4);
    const win = maxAlt(2026, 12, 21, lat, lon);
    check('Altura al mediodía solar, solsticio de invierno', win.altitude, 90 - lat - 23.436, 0.1);
    check('Azimut al mediodía solar de invierno', win.azimuth, 180, 1);
    check('Ecuación del tiempo 3 nov (≈ +16,4 min)', sunPosition(Date.UTC(2026, 10, 3, 12), 0, 0).eqTime, 16.4, 0.3);

    // Zonas horarias
    check('Desfase Atlantic/Canary en julio (min)', tzOffsetMinutes(Date.UTC(2026, 6, 1, 12), 'Atlantic/Canary'), 60, 0);
    check('Desfase Europe/Madrid en enero (min)', tzOffsetMinutes(Date.UTC(2026, 0, 15, 12), 'Europe/Madrid'), 60, 0);
    check('12:00 Madrid el 1 jul → 10:00 UTC', new Date(localToUtc(2026, 182, 720, 'Europe/Madrid', -3.7)).getUTCHours(), 10, 0);

    // Geometría: sol de frente a 45°, sin obstáculos
    const base = cloneConfig(DEFAULT_CONFIG);
    base.facade.wallThickness = 0;
    base.street.oppositeHeight = 0;
    base.awning.enabled = false;
    base.room.windowHeight = 3;
    base.room.sillHeight = 0;
    const s45 = sunVectorLocal(180, 45, 180);
    check('Ángulo de perfil con sol de frente a 45°', profileAngle(s45), 45, 1e-9);
    let r = computeInstant(base, s45, 800, { ny: 200, nz: 5 });
    check('Penetración sin obstáculos (ventana 3 m, perfil 45°)', r.depth, 3, 0.02);
    check('Ventana soleada sin obstáculos', r.litFraction, 1, 1e-9);
    check('Área soleada en suelo = área de ventana × cot(45°)', r.floorArea, 9, 0.01);
    check('Potencia = DNI·cosθ·A·τ', r.power, 800 * Math.cos(Math.PI / 4) * 9 * 0.8, 0.5);

    // Edificio de enfrente: 12 m a 8 m → bloquea y < 4 m … con 10 m de separación bloquea y < 2
    const ob = cloneConfig(base);
    ob.street.separation = 10;
    ob.street.oppositeHeight = 12;
    r = computeInstant(ob, s45, 800, { ny: 300, nz: 5 });
    check('Edificio de enfrente: fracción soleada 1/3', r.litFraction, 1 / 3, 0.01);

    // Toldo horizontal a 3,2 m con 1 m de vuelo → sombra para y ≥ 2,2
    const aw = cloneConfig(base);
    Object.assign(aw.awning, { enabled: true, mountHeight: 3.2, angle: 0, length: 1, width: 50, transmittance: 0 });
    r = computeInstant(aw, s45, 800, { ny: 300, nz: 5 });
    check('Toldo horizontal: fracción soleada 2,2/3', r.litFraction, 2.2 / 3, 0.01);
    check('Toldo horizontal: penetración 2,2 m', r.depth, 2.2, 0.02);

    // Sol detrás de la fachada
    r = computeInstant(base, sunVectorLocal(0, 45, 180), 800);
    check('Sol detrás de la fachada → sin luz directa', r.power, 0, 0);

    document.getElementById('summary').innerHTML = `<b class="${fail ? 'fail' : 'ok'}">${pass} correctas, ${fail} fallidas</b>`;
  </script>
</body>
</html>
